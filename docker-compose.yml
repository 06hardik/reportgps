# ─────────────────────────────────────────────────────────────────────────────
# ReportGPS — docker-compose.yml (Cloudflare Tunnel Edition)
#
# Architecture:
#   Internet → Cloudflare Edge → cloudflared (tunnel) → nginx → frontend/backend
#
# No ports are exposed to the internet. The college firewall never needs to
# be touched. SSL is handled entirely by Cloudflare at their edge.
#
# Services:
#   pipeline     — Python FastAPI extraction engine (internal, port 8004)
#   backend      — Node.js Express proxy (internal, port 5001)
#   frontend     — React SPA served by Nginx (internal, port 80)
#   nginx        — Internal HTTP reverse proxy (routes /api vs. frontend)
#   cloudflared  — Cloudflare Tunnel client (outbound only, no open ports)
#
# Usage:
#   First time:   docker compose up -d
#   Logs:         docker compose logs -f
#   Update code:  git pull && docker compose up -d --build
#   Stop:         docker compose down
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Python Extraction Pipeline ─────────────────────────────────────────────
  pipeline:
    build:
      context: ./services/extraction-pipeline
      dockerfile: Dockerfile
    container_name: reportgps-pipeline
    restart: unless-stopped
    expose:
      - "8004"
    env_file:
      - ./services/extraction-pipeline/.env
    volumes:
      - pipeline-tmp:/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal

  # ── Node.js Backend Proxy ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reportgps-backend
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      - PORT=5001
      - EXTRACTION_SERVICE_URL=http://pipeline:8004
    depends_on:
      pipeline:
        condition: service_healthy
    networks:
      - internal

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reportgps-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  # ── Internal Nginx Reverse Proxy ───────────────────────────────────────────
  # Nginx only handles internal routing: /api/* → backend, /* → frontend.
  # SSL is NOT handled here — Cloudflare terminates SSL at their edge.
  # This container is NOT exposed to the internet (no ports: mapping).
  nginx:
    image: nginx:1.27-alpine
    container_name: reportgps-nginx
    restart: unless-stopped
    # No ports exposed externally — only reachable inside Docker network
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal

  # ── Cloudflare Tunnel ──────────────────────────────────────────────────────
  # Makes the app publicly accessible via reportgps.com WITHOUT opening any
  # firewall ports. Establishes an outbound connection to Cloudflare's network.
  # Cloudflare routes reportgps.com traffic through this tunnel to nginx:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reportgps-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Paste your tunnel token here (from Cloudflare Zero Trust dashboard)
      # Or store it in a root .env file: CLOUDFLARE_TUNNEL_TOKEN=eyJ...
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - internal

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  pipeline-tmp:

# ── Network ────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
