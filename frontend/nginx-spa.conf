# Nginx config for serving the React SPA inside the frontend container.
# This container only serves static files on port 80.
# The main reverse proxy (nginx/ at root) handles HTTPS, domain, and /api routing.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Fix: .mjs files (PDF.js worker) ──────────────────────────────────────
    # CORRECT nginx pattern to override MIME type for a location:
    #   types {}        clears the default mime.types lookup for this block
    #   default_type    sets what type to use when types{} map has no match
    # Using add_header Content-Type alone does NOT override the detected type —
    # it just adds a second header which browsers may ignore.
    location ~* \.mjs$ {
        types        { }   # disable built-in mime.types for this location
        default_type application/javascript;
        expires      1y;
        add_header   Cache-Control "public, immutable";
        try_files    $uri =404;
    }

    # ── Fix: .wasm files ──────────────────────────────────────────────────────
    location ~* \.wasm$ {
        types        { }
        default_type application/wasm;
        expires      1y;
        add_header   Cache-Control "public, immutable";
        try_files    $uri =404;
    }

    # ── All React routes → serve index.html (client-side routing) ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets (content-hashed filenames) ────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
