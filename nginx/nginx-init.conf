# ─────────────────────────────────────────────────────────────────────────────
# nginx-init.conf — Temporary HTTP-only config for first-time SSL setup
#
# Usage:
#   1. cp nginx/nginx-init.conf nginx/nginx.conf
#   2. docker compose up -d nginx
#   3. docker compose run --rm certbot
#   4. cp nginx/nginx.conf.ssl nginx/nginx.conf
#   5. docker compose restart nginx
#
# After Step 5, delete this file — it is only needed once.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name reportgps.com www.reportgps.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporary: serve the app over HTTP while cert is being issued
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
