# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy — Entry point for all traffic to reportgps.com
#
# Responsibilities:
#   1. Redirect HTTP (port 80) → HTTPS (port 443)
#   2. Terminate SSL using Let's Encrypt certificates
#   3. Serve the React frontend static files (via frontend container)
#   4. Proxy /api/* requests to the Node.js backend container
#
# Replace "reportgps.com" with your actual domain if different.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name reportgps.com www.reportgps.com;

    # Let's Encrypt ACME challenge (needed for certificate renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name reportgps.com www.reportgps.com;

    # ── SSL Certificates (managed by Certbot) ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/reportgps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reportgps.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    nosniff;
    add_header X-Frame-Options           SAMEORIGIN;

    # ── File upload limit (for PDF files) ────────────────────────────────────
    client_max_body_size 50M;

    # ── API proxy → Node.js backend container ────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # No proxy timeout — the pipeline can take up to ~60s with verifier on
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # ── Frontend → React SPA container ───────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
