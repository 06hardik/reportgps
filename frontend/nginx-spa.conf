# Nginx config for serving the React SPA inside the frontend container.
# This container only serves static files on port 80.
# The main reverse proxy (nginx/ at root) handles HTTPS, domain, and /api routing.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # All routes that don't match a real file → serve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Fix: .mjs files must be served as JavaScript ─────────────────────────
    # Nginx alpine does not map .mjs to application/javascript by default.
    # Without this, the browser rejects the PDF.js worker with a MIME error.
    location ~* \.mjs$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Also fix .wasm files (WebAssembly — used by some PDF.js builds)
    location ~* \.wasm$ {
        add_header Content-Type "application/wasm";
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache static assets aggressively (they have content hashes in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access log for health checks
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
