# ─────────────────────────────────────────────────────────────────────────────
# Internal Nginx Reverse Proxy (HTTP only)
#
# This nginx handles routing between the frontend and backend containers.
# It is NOT the public entry point — Cloudflare Tunnel is.
# SSL termination is handled by Cloudflare at their edge, not here.
#
# Traffic flow:
#   Cloudflare → cloudflared container → nginx:80 → frontend/backend
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # ── File upload size limit for PDF files ─────────────────────────────────
    client_max_body_size 50M;

    # ── API requests → Node.js backend ───────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Long timeout — PDF extraction with LLM verifier can take up to ~60s
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # ── Everything else → React frontend ─────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
